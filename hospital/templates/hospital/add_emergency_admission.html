{% extends "hospital/base.html" %}
{% block title %}Add Emergency Admission - Hospital Management{% endblock %}

{% block content %}
<div class="container">
<div class="form-container">
    <h1><i class="fas fa-exclamation-triangle"></i> Emergency Admission</h1>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Patient <span class="text-danger">*</span></label>
            <select name="patient" class="form-control" required>
                <option value="">Select Patient</option>
                {% for patient in patients %}
                <option value="{{ patient.id }}">{{ patient.get_full_name|default:patient }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Priority Level <span class="text-danger">*</span></label>
            <select name="priority" class="form-control" required>
                <option value="">Select Priority</option>
                <option value="stable">Stable (Green)</option>
                <option value="urgent">Urgent (Yellow)</option>
                <option value="critical">Critical (Red)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Chief Complaint / Reason <span class="text-danger">*</span></label>
            <input type="text" name="reason" class="form-control" placeholder="Road accident, chest pain, difficulty breathing..." required>
        </div>

        <div class="form-group">
            <label>Presenting Symptoms</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Symptoms, vitals on arrival, conscious/unconscious..."></textarea>
        </div>

        <div class="form-group">
            <label>Initial Assessment</label>
            <input type="text" name="initial_diagnosis" class="form-control" placeholder="e.g., Fractured femur, Acute MI">
        </div>

        <div class="form-group-inline">
            <div>
                <label>Arrival Time</label>
                <input type="datetime-local" name="arrival_time" class="form-control" value="{{ now|date:'Y-m-d\\TH:i' }}">
            </div>
            <div>
                <label>Triage Time</label>
                <input type="datetime-local" name="triage_time" class="form-control">
            </div>
        </div>

        <div class="form-group">
            <label>Emergency Contact</label>
            <select name="emergency_contact" class="form-control">
                <option value="">Select Contact</option>
                {% for contact in emergency_contacts %}
                <option value="{{ contact.id }}">{{ contact.name }} - {{ contact.phone }} ({{ contact.relationship }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Incoming Ambulance</label>
            <select name="ambulance" class="form-control">
                <option value="">Walk-in or Self</option>
                {% for amb in ambulances %}
                <option value="{{ amb.id }}">{{ amb.vehicle_number }} ({{ amb.driver_name }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Assign to ER Room / Bed</label>
            <select name="admitted_to" class="form-control">
                <option value="">Triage Area</option>
                {% for room in rooms %}
                <option value="{{ room.id }}">{{ room.room_number }} ({{ room.status }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Triage Notes</label>
            <textarea name="triage_notes" class="form-control" rows="3" placeholder="Glasgow coma scale, AVPU, vital signs, allergies, medications..."></textarea>
        </div>

        <div class="form-actions" style="text-align: right; margin-top: 2rem;">
            <a href="{% url 'emergency_admission_list' %}" class="btn btn-secondary mr-2">
                <i class="fas fa-times"></i> Cancel
            </a>
            <button type="submit" class="btn btn-danger btn-lg">
                <i class="fas fa-ambulance"></i> Admit Emergency Patient
            </button>
        </div>
    </form>
</div>
</div>
{% endblock %}
