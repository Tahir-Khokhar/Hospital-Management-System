{% extends "hospital/base.html" %}
{% block title %}Record Vital Signs - Hospital Management{% endblock %}

{% block content %}
<div class="container">
<div class="form-container">
    <h1><i class="fas fa-heartbeat"></i> Record Vital Signs</h1>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Patient <span class="text-danger">*</span></label>
            <select name="patient" class="form-control" required>
                <option value="">Select Patient</option>
                {% for patient in patients %}
                <option value="{{ patient.id }}">{{ patient.get_full_name|default:patient }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group-inline">
            <div>
                <label>Blood Pressure Systolic <span class="text-danger">*</span></label>
                <input type="number" name="blood_pressure_systolic" class="form-control" min="50" max="250" placeholder="120" required>
            </div>
            <div>
                <label>Diastolic <span class="text-danger">*</span></label>
                <input type="number" name="blood_pressure_diastolic" class="form-control" min="30" max="150" placeholder="80" required>
                <small>mmHg</small>
            </div>
        </div>

        <div class="form-group-inline">
            <div>
                <label>Heart Rate <span class="text-danger">*</span></label>
                <input type="number" name="heart_rate" class="form-control" min="30" max="200" placeholder="72" required>
                <small>bpm</small>
            </div>
            <div>
                <label>Temperature <span class="text-danger">*</span></label>
                <input type="number" name="temperature" class="form-control" step="0.1" min="90" max="109" placeholder="98.6" required>
                <small>°F</small>
            </div>
        </div>

        <div class="form-group-inline">
            <div>
                <label>Respiratory Rate <span class="text-danger">*</span></label>
                <input type="number" name="respiratory_rate" class="form-control" min="6" max="60" placeholder="16" required>
                <small>rpm</small>
            </div>
            <div>
                <label>O₂ Saturation <span class="text-danger">*</span></label>
                <input type="number" name="oxygen_saturation" class="form-control" min="70" max="100" placeholder="98" required>
                <small>%</small>
            </div>
        </div>

        <div class="form-group-inline">
            <div>
                <label>Weight</label>
                <input type="number" name="weight" class="form-control" step="0.1" min="0.1" max="500" placeholder="70.5">
                <small>kg</small>
            </div>
            <div>
                <label>Height</label>
                <input type="number" name="height" class="form-control" step="0.1" min="30" max="250" placeholder="170">
                <small>cm</small>
            </div>
        </div>

        <div class="form-group">
            <label>Notes / Observations</label>
            <textarea name="notes" class="form-control" rows="4" placeholder="Patient condition, pain scale, mental status, abnormalities..."></textarea>
        </div>

        <div class="form-actions" style="text-align: right; margin-top: 2rem;">
            <a href="{% url 'vital_sign_list' %}" class="btn btn-secondary mr-2">
                <i class="fas fa-times"></i> Cancel
            </a>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Save Vital Signs
            </button>
        </div>
    </form>
</div>
</div>
{% endblock %}
