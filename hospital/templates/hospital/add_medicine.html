{% extends "hospital/base.html" %}
{% block title %}Add Medicine - Hospital Management{% endblock %}

{% block content %}
<div class="container">
<div class="form-container">
    <h1><i class="fas fa-pills"></i> Add Medicine to Inventory</h1>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Medicine Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" placeholder="e.g., Paracetamol 500mg Tablet" required>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select name="category" class="form-control">
                <option value="">Select Category</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group-inline">
            <div>
                <label>Generic Name</label>
                <input type="text" name="generic_name" class="form-control" placeholder="Paracetamol (Acetaminophen)">
            </div>
            <div>
                <label>Strength</label>
                <input type="text" name="strength" class="form-control" placeholder="500mg">
            </div>
        </div>

        <div class="form-group">
            <label>Manufacturer / Brand</label>
            <input type="text" name="manufacturer" class="form-control" placeholder="e.g., GSK, Pfizer, Local Pharma">
        </div>

        <div class="form-group-inline">
            <div>
                <label>Initial Stock <span class="text-danger">*</span></label>
                <input type="number" name="quantity_in_stock" class="form-control" min="0" value="0" required>
            </div>
            <div>
                <label>Unit <span class="text-danger">*</span></label>
                <input type="text" name="unit" class="form-control" placeholder="tabs, caps, ml, vials, amps" required>
            </div>
        </div>

        <div class="form-group-inline">
            <div>
                <label>Reorder Level <span class="text-danger">*</span></label>
                <input type="number" name="reorder_level" class="form-control" min="1" value="10" required>
            </div>
            <div>
                <label>Expiry Date <span class="text-danger">*</span></label>
                <input type="date" name="expiry_date" class="form-control" required>
            </div>
        </div>

        <div class="form-group-inline">
            <div>
                <label>Cost per Unit</label>
                <input type="number" name="cost_per_unit" class="form-control" step="0.01" min="0" placeholder="0.00">
            </div>
            <div>
                <label>Selling Price per Unit <span class="text-danger">*</span></label>
                <input type="number" name="selling_price_per_unit" class="form-control" step="0.01" min="0" placeholder="1.50" required>
            </div>
        </div>

        <div class="form-group">
            <label>Description / Usage</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Pain relief, antibiotic, analgesic. Take with food."></textarea>
        </div>

        <div class="form-group">
            <label>Side Effects / Warnings</label>
            <textarea name="side_effects" class="form-control" rows="3" placeholder="Nausea, drowsiness. Avoid alcohol. Not for pregnant women."></textarea>
        </div>

        <div class="form-actions" style="text-align: right; margin-top: 2rem;">
            <a href="{% url 'medicine_list' %}" class="btn btn-secondary mr-2">
                <i class="fas fa-times"></i> Cancel
            </a>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Add to Inventory
            </button>
        </div>
    </form>
</div>
</div>
{% endblock %}
