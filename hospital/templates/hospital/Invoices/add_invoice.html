{% extends 'hospital/base.html' %}
{% block title %}Create Invoice{% endblock %}
{% block content %}
<div class="form-container">
    <h1><i class="fas fa-plus"></i> Create Invoice</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group"><label>Invoice Number</label><input type="text" name="invoice_number" required></div>
        <div class="form-group"><label>Patient</label><select name="patient" required>{% for p in patients %}<option value="{{ p.pk }}">{{ p }}</option>{% endfor %}</select></div>
        <div class="form-group"><label>Room Charges ($)</label><input type="number" name="room_charges" value="0" min="0" step="0.01"></div>
        <div class="form-group"><label>Medication Charges ($)</label><input type="number" name="medication_charges" value="0" min="0" step="0.01"></div>
        <div class="form-group"><label>Other Charges ($)</label><input type="number" name="other_charges" value="0" min="0" step="0.01"></div>
        <div class="form-group"><label>Due Date</label><input type="date" name="due_date" required></div>
        <div class="form-group"><label>Notes</label><textarea name="notes"></textarea></div>
        <button type="submit" class="btn btn-primary">Create Invoice</button>
    </form>
</div>
{% endblock %}
