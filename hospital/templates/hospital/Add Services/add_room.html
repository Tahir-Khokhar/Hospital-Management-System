{% extends 'hospital/base.html' %}

{% block title %}Add Room{% endblock %}

{% block content %}
<div class="form-container">
    <h1><i class="fas fa-plus"></i> Add Room</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Room Number</label>
            <input type="text" name="room_number" required>
        </div>
        <div class="form-group">
            <label>Room Type</label>
            <select name="room_type" required>
                <option value="general">General Ward</option>
                <option value="private">Private Room</option>
                <option value="icu">ICU</option>
                <option value="operation">Operation Theater</option>
                <option value="emergency">Emergency Room</option>
            </select>
        </div>
        <div class="form-group">
            <label>Floor</label>
            <input type="number" name="floor" value="1" min="1">
        </div>
        <div class="form-group">
            <label>Capacity (Number of Beds)</label>
            <input type="number" name="capacity" value="1" min="1">
        </div>
        <div class="form-group">
            <label>Price per Day ($)</label>
            <input type="number" name="price_per_day" value="0" min="0" step="0.01">
        </div>
        <button type="submit" class="btn btn-primary">Add Room</button>
    </form>
</div>
{% endblock %}
