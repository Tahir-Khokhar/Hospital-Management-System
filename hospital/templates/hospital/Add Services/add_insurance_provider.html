{% extends "hospital/base.html" %}
{% block title %}Add Insurance Provider - Hospital Management{% endblock %}

{% block content %}
<div class="container">
<div class="form-container">
    <h1><i class="fas fa-shield-alt"></i> Add Insurance Provider</h1>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Company Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" placeholder="e.g., Blue Cross, Medicare, State Health Insurance" required>
        </div>

        <div class="form-group-inline">
            <div>
                <label>Provider Code <span class="text-danger">*</span></label>
                <input type="text" name="code" class="form-control" placeholder="BLUE, MEDI, STATE" maxlength="10" required>
            </div>
            <div>
                <label>Status</label>
                <select name="is_active" class="form-control">
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea name="address" class="form-control" rows="3" placeholder="123 Insurance Street, City State 12345"></textarea>
        </div>

        <div class="form-group-inline">
            <div>
                <label>Phone</label>
                <input type="tel" name="phone" class="form-control" placeholder="(555) 123-4567">
            </div>
            <div>
                <label>Fax</label>
                <input type="tel" name="fax" class="form-control" placeholder="(555) 123-4568">
            </div>
        </div>

        <div class="form-group-inline">
            <div>
                <label>Email</label>
                <input type="email" name="email" class="form-control" placeholder="claims@insurance.com">
            </div>
            <div>
                <label>Claims Email</label>
                <input type="email" name="claims_email" class="form-control" placeholder="claims@insurance.com">
            </div>
        </div>

        <div class="form-group">
            <label>Website</label>
            <input type="url" name="website" class="form-control" placeholder="https://www.insurance.com">
        </div>

        <div class="form-group">
            <label>Coverage Notes</label>
            <textarea name="coverage_notes" class="form-control" rows="3" placeholder="80% hospitalization, pre-auth required for surgeries, annual cap $100k"></textarea>
        </div>

        <div class="form-group">
            <label>Claims Contact Person</label>
            <input type="text" name="claims_contact" class="form-control" placeholder="John Doe - Claims Manager">
        </div>

        <div class="form-actions" style="text-align: right; margin-top: 2rem;">
            <a href="{% url 'insurance_provider_list' %}" class="btn btn-secondary mr-2">
                <i class="fas fa-times"></i> Cancel
            </a>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Save Provider
            </button>
        </div>
    </form>
</div>
</div>
{% endblock %}
