{% extends 'hospital/base.html' %}

{% block title %}Add Staff{% endblock %}

{% block content %}
<div class="form-container">
    <h1><i class="fas fa-user-plus"></i> Add Staff Member</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Staff Type</label>
            <select name="staff_type" class="form-control" required>
                <option value="nurse">Nurse</option>
                <option value="wardboy">Ward Boy</option>
            </select>
        </div>
        <div class="form-group">
            <label>Gender</label>
            <select name="gender" class="form-control" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Age</label>
            <input type="number" name="age" class="form-control" value="25" required>
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control">
        </div>
        <div class="form-group">
            <label>Address</label>
            <textarea name="address" class="form-control" required></textarea>
        </div>
        <div class="form-group">
            <label>Salary</label>
            <input type="number" step="0.01" name="salary" class="form-control" value="0">
        </div>
        <div class="form-group">
            <label>Shift</label>
            <select name="shift" class="form-control">
                <option value="morning">Morning</option>
                <option value="evening">Evening</option>
                <option value="night">Night</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Add Staff</button>
    </form>
</div>
{% endblock %}
