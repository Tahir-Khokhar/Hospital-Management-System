{% extends 'hospital/base.html' %}
{% block title %}Add Treatment{% endblock %}
{% block content %}
<div class="form-container">
    <h1><i class="fas fa-plus"></i> Add Treatment</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Patient</label>
            <select name="patient" required>{% for p in patients %}<option value="{{ p.pk }}">{{ p }}</option>{% endfor %}</select>
        </div>
        <div class="form-group">
            <label>Doctor</label>
            <select name="doctor" required>{% for d in doctors %}<option value="{{ d.pk }}">{{ d }}</option>{% endfor %}</select>
        </div>
        <div class="form-group"><label>Treatment Name</label><input type="text" name="treatment_name" required></div>
        <div class="form-group"><label>Description</label><textarea name="description" required></textarea></div>
        <div class="form-group"><label>Start Date</label><input type="date" name="start_date" required></div>
        <div class="form-group"><label>End Date (optional)</label><input type="date" name="end_date"></div>
        <div class="form-group"><label>Medications</label><textarea name="medications"></textarea></div>
        <div class="form-group"><label>Instructions</label><textarea name="instructions"></textarea></div>
        <div class="form-group"><label>Cost ($)</label><input type="number" name="cost" value="0" min="0" step="0.01"></div>
        <button type="submit" class="btn btn-primary">Add Treatment</button>
    </form>
</div>
{% endblock %}
