{% extends 'hospital/base.html' %}

{% block title %}Schedule Operation{% endblock %}

{% block content %}
<div class="form-container">
    <h1><i class="fas fa-plus"></i> Schedule Operation</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Patient</label>
            <select name="patient" required>
                {% for p in patients %}
                <option value="{{ p.pk }}">{{ p }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Doctor</label>
            <select name="doctor" required>
                {% for d in doctors %}
                <option value="{{ d.pk }}">{{ d }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Operation Room</label>
            <select name="room">
                <option value="">Select Room</option>
                {% for r in rooms %}
                <option value="{{ r.pk }}">{{ r }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Operation Name</label>
            <input type="text" name="operation_name" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description"></textarea>
        </div>
        <div class="form-group">
            <label>Scheduled Date & Time</label>
            <input type="datetime-local" name="scheduled_date" required>
        </div>
        <div class="form-group">
            <label>Duration (hours)</label>
            <input type="number" name="duration_hours" value="1" min="1">
        </div>
        <div class="form-group">
            <label>Cost ($)</label>
            <input type="number" name="cost" value="0" min="0" step="0.01">
        </div>
        <button type="submit" class="btn btn-primary">Schedule Operation</button>
    </form>
</div>
{% endblock %}
