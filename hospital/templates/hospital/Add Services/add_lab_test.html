{% extends 'hospital/base.html' %}
{% block title %}Add Lab Test{% endblock %}
{% block content %}
<div class="form-container">
    <h1><i class="fas fa-plus"></i> Add Lab Test</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Patient</label>
            <select name="patient" required>{% for p in patients %}<option value="{{ p.pk }}">{{ p }}</option>{% endfor %}</select>
        </div>
        <div class="form-group">
            <label>Test Type</label>
            <select name="test_type" required>
                <option value="blood">Blood Test</option>
                <option value="urine">Urine Test</option>
                <option value="xray">X-Ray</option>
                <option value="mri">MRI Scan</option>
                <option value="ct">CT Scan</option>
                <option value="ultrasound">Ultrasound</option>
                <option value="ecg">ECG</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="form-group"><label>Description</label><textarea name="description"></textarea></div>
        <div class="form-group"><label>Scheduled Date</label><input type="date" name="scheduled_date" required></div>
        <div class="form-group"><label>Cost ($)</label><input type="number" name="cost" value="0" min="0" step="0.01"></div>
        <button type="submit" class="btn btn-primary">Add Lab Test</button>
    </form>
</div>
{% endblock %}
