{% extends "hospital/base.html" %}
{% block title %}Edit Payment Plan{% endblock %}

{% block content %}
<div class="container">
<div class="form-container">
    <h1>Edit Payment Plan #{{ plan.id }}</h1>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Total Amount</label>
            <input type="number" name="total_amount" value="{{ plan.total_amount }}" class="form-control" step="0.01">
        </div>
        <div class="form-group">
            <label>Monthly Payment</label>
            <input type="number" name="monthly_payment" value="{{ plan.monthly_payment }}" class="form-control" step="0.01">
        </div>
        <div class="form-group">
            <label>Next Payment Date</label>
            <input type="date" name="next_payment_date" value="{{ plan.next_payment_date|date:'Y-m-d' }}" class="form-control">
        </div>
        <div class="form-group">
            <label>Status</label>
            <select name="status" class="form-control">
                <option value="active" {% if plan.status == 'active' %}selected{% endif %}>Active</option>
                <option value="completed" {% if plan.status == 'completed' %}selected{% endif %}>Completed</option>
                <option value="defaulted" {% if plan.status == 'defaulted' %}selected{% endif %}>Defaulted</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Update Plan</button>
        <a href="{% url 'payment_plan_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</div>
{% endblock %}
